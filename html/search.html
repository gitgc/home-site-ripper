<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{env "SITE_TITLE"}}</title>
  <link rel="stylesheet" href="/_pagefind/pagefind-ui.css" onerror="this.remove()">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a2b4a;
      color: #fff;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: .02em; }
    header p  { margin-top: .4rem; font-size: .9rem; opacity: .65; }

    main { max-width: 860px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    #search-wrap { margin-bottom: 2.5rem; }

    /* pagefind-ui overrides */
    .pagefind-ui { --pagefind-ui-font: inherit; }

    .index-error {
      background: #fff8e1;
      border: 1px solid #f0c040;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      font-size: .9rem;
      line-height: 1.5;
    }
    .index-error code {
      background: #eee;
      padding: .1em .4em;
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: .85em;
    }

    h2 {
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #888;
      margin-bottom: 1rem;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: .75rem;
    }

    .section-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color .15s, box-shadow .15s;
    }
    .section-card:hover {
      border-color: #1a2b4a;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .section-card strong { display: block; font-size: .95rem; margin-bottom: .3rem; }
    .section-card span   { font-size: .8rem; color: #888; }
  </style>
</head>
<body>

<header>
  <h1>{{env "SITE_TITLE"}}</h1>
  {{if env "SITE_SUBTITLE"}}<p>{{env "SITE_SUBTITLE"}}</p>{{end}}
</header>

<main>
  <div id="search-wrap">
    <div id="search"></div>
    <div id="index-error" class="index-error" hidden>
      Search index not built yet &mdash; run <code>./scripts/index.sh</code> then restart Caddy.
    </div>
  </div>

  <h2>Browse by section</h2>
  {{include "/browse.html"}}
</main>

<script
  src="/_pagefind/pagefind-ui.js"
  onload="initSearch()"
  onerror="document.getElementById('index-error').hidden = false;
           document.getElementById('search').remove()">
</script>
<script>
  function initSearch() {
    var ui = new PagefindUI({
      element: '#search',
      showSubResults: true,
      showImages: false,
      excerptLength: 15,
    });

    var q = new URLSearchParams(window.location.search).get('q');
    if (q) {
      if (typeof ui.triggerSearch === 'function') {
        ui.triggerSearch(q);
      } else {
        setTimeout(function () { ui.triggerSearch(q); }, 0);
      }
    }
  }
</script>

</body>
</html>
