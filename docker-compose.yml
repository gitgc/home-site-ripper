services:
  ripper:
    image: debian:bookworm-slim
    environment:
      SITE_URL:
      WGET_CUT_DIRS:
    command: ["bash", "/scripts/wget.sh"]
    volumes:
      - ./scripts/volume/wget.sh:/scripts/wget.sh:ro
      - ./site:/site
    profiles:
      - rip

  indexer:
    image: node:26-slim
    command: ["bash", "/scripts/pagefind.sh"]
    volumes:
      - ./scripts/volume/pagefind.sh:/scripts/pagefind.sh:ro
      - ./site:/site:ro
      - ./index:/index
    environment:
      PAGEFIND_GLOB:
    profiles:
      - index

  cleaner:
    image: python:3-slim
    command:
      - bash
      - -c
      - |
        pip install -q -r /clean/requirements.txt
        python /clean/clean.py /site "${PAGEFIND_GLOB}"
    volumes:
      - ./clean:/clean:ro
      - ./site:/site
    environment:
      SITE_URL:
      PAGEFIND_GLOB:
    profiles:
      - clean

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./index:/srv/_pagefind:ro
      - ./html/search.html:/srv/search.html:ro
      - ./html/browse.html:/srv/browse.html:ro
    environment:
      SITE_TITLE:
      SITE_SUBTITLE:
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
