services:
  ripper:
    image: debian:bookworm-slim
    environment:
      SITE_URL:
      WGET_CUT_DIRS: ${WGET_CUT_DIRS:-0}
    command: ["bash", "/scripts/wget.sh"]
    volumes:
      - ./scripts/volume/wget.sh:/scripts/wget.sh:ro
      - ./site:/site
    profiles:
      - rip

  indexer:
    image: node:26-slim
    command: ["bash", "/scripts/pagefind.sh"]
    volumes:
      - ./scripts/volume/pagefind.sh:/scripts/pagefind.sh:ro
      - ./site:/site:ro
      - ./index:/index
    environment:
      PAGEFIND_GLOB: ${PAGEFIND_GLOB:-[Ss][Cc]*/*.html}
    profiles:
      - index

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./index:/srv/_pagefind:ro
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
