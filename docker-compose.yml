services:
  ripper:
    image: debian:bookworm-slim
    environment:
      SITE_URL:
    command:
      - bash
      - -c
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq wget
        wget --mirror --no-host-directories --cut-dirs=1 \
          --page-requisites --convert-links --adjust-extension \
          --no-verbose --directory-prefix=/site \
          "${SITE_URL}"
    volumes:
      - ./site:/site
    profiles:
      - rip

  indexer:
    image: node:20-slim
    command:
      - bash
      - -c
      - |
        set -e
        npx -y pagefind@latest --site /site --output-path /index --glob "${PAGEFIND_GLOB}"
    volumes:
      - ./site:/site:ro
      - ./index:/index
    environment:
      PAGEFIND_GLOB: ${PAGEFIND_GLOB:-[Ss][Cc]*/*.html}
    profiles:
      - index

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - ./index:/srv/_pagefind:ro
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
